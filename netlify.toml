[build]
  publish = "public"
  functions = "netlify/functions"
  command = "node scripts/csv-to-plan.js"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# Front end calls /api/<name>; every function verifies the access token itself.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Service worker must always be revalidated so updates are noticed.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

# API responses (signed URLs, copyright) are never cached anywhere.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
